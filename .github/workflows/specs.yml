name: Specs

on:
  pull_request:

  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "specs-${{ github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MSYS_NO_PATHCONV: "1"

jobs:
  install-kotlinstall:
    name: should install kotlinstall with the installer script on ${{ matrix.host.name }}
    runs-on: ${{ matrix.host.runner }}
    strategy: &hosts
      fail-fast: false
      matrix:
        host: &host-list
          - name: Linux x64
            runner: ubuntu-latest
            target: linuxX64
            extension: kexe
            suffix: ""
          - name: macOS Apple silicon
            runner: macos-latest
            target: macosArm64
            extension: kexe
            suffix: ""
          - name: Windows x64
            runner: windows-latest
            target: mingwX64
            extension: exe
            suffix: .exe
    steps:
      # Arrange
      - &checkout
        name: Checkout
        uses: actions/checkout@v7

      - &setup-jdk-and-gradle
        name: Set up the JDK and Gradle
        uses: yuyuyuyuyu-dev/repo-config/.github/actions/setup-jdk-and-gradle@main

      - &set-paths
        name: Set the paths in the form that the host understands
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            temporary="$(cygpath --mixed "$RUNNER_TEMP")"
            workspace="$(cygpath --mixed "$GITHUB_WORKSPACE")"
            {
              echo "TEMPORARY=$temporary"
              echo "TEMPORARY_URL=file:///$temporary"
              echo "WORKSPACE_URL=file:///$workspace"
            } >> "$GITHUB_ENV"
          else
            {
              echo "TEMPORARY=$RUNNER_TEMP"
              echo "TEMPORARY_URL=file://$RUNNER_TEMP"
              echo "WORKSPACE_URL=file://$GITHUB_WORKSPACE"
            } >> "$GITHUB_ENV"
          fi

      # Act
      - name: Run the installer script as the README says for macOS and Linux
        if: runner.os != 'Windows'
        run: cat install-kotlinstall.main.kts | kotlinr -howtorun .main.kts /dev/stdin --git "$WORKSPACE_URL"

      - name: Run the installer script as the README says for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: kotlinr install-kotlinstall.main.kts --git $env:WORKSPACE_URL

      # Assert
      - &run-installed-kotlinstall
        name: Run the installed kotlinstall
        run: ~/.kotlinstall/bin/kotlinstall${{ matrix.host.suffix }} --help

  install-program:
    name: should install a program written in Kotlin on ${{ matrix.host.name }}
    runs-on: ${{ matrix.host.runner }}
    strategy: *hosts
    env: &kotlinstall
      KOTLINSTALL: build/bin/${{ matrix.host.target }}/releaseExecutable/kotlinstall.${{ matrix.host.extension }}
    steps:
      # Arrange
      - *checkout
      - *setup-jdk-and-gradle
      - *set-paths

      - &build-kotlinstall
        name: Build kotlinstall
        run: ./gradlew linkReleaseExecutable${{ matrix.host.target }}

      # Act
      - &install-program
        name: Install kotlinstall itself as the program written in Kotlin
        run: '"$KOTLINSTALL" install "$WORKSPACE_URL"'

      # Assert
      - *run-installed-kotlinstall

  install-program-from-subdirectory:
    name: should install a program from a project in a subdirectory of the repository on ${{ matrix.host.name }}
    runs-on: ${{ matrix.host.runner }}
    strategy: *hosts
    env: *kotlinstall
    steps:
      # Arrange
      - *checkout
      - *setup-jdk-and-gradle
      - *set-paths
      - *build-kotlinstall

      - name: Create a repository that has kotlinstall in a subdirectory named differently from its Gradle project
        env:
          GIT_AUTHOR_NAME: kotlinstall
          GIT_AUTHOR_EMAIL: kotlinstall@example.com
          GIT_COMMITTER_NAME: kotlinstall
          GIT_COMMITTER_EMAIL: kotlinstall@example.com
        run: |
          mkdir "$TEMPORARY/repository"
          git archive --prefix=cli/ HEAD | tar -x -C "$TEMPORARY/repository"
          cd "$TEMPORARY/repository"
          git init --quiet --initial-branch main
          git add --all
          git commit --quiet --message "Add kotlinstall"

      # Act
      - name: Install kotlinstall from the subdirectory
        run: '"$KOTLINSTALL" install "$TEMPORARY_URL/repository" --subdirectory=cli'

      # Assert
      - *run-installed-kotlinstall

      - name: Assert that the package is named after the Gradle project
        run: |
          revision="$(git -C "$TEMPORARY/repository" rev-parse HEAD | cut -c 1-7)"
          ~/.kotlinstall/bin/kotlinstall${{ matrix.host.suffix }} list | tr -d '\r' > "$TEMPORARY/list.txt"
          diff --unified - "$TEMPORARY/list.txt" <<EOF
          package:  kotlinstall
          commands: kotlinstall
          source:   $TEMPORARY_URL/repository --subdirectory=cli
          revision: $revision
          EOF

  uninstall-program:
    name: should uninstall a program written in Kotlin on ${{ matrix.host.name }}
    needs: install-program
    runs-on: ${{ matrix.host.runner }}
    strategy: *hosts
    env: *kotlinstall
    steps:
      # Arrange
      - *checkout
      - *setup-jdk-and-gradle
      - *set-paths
      - *build-kotlinstall
      - *install-program

      # Act
      - name: Uninstall the program
        run: '"$KOTLINSTALL" uninstall kotlinstall'

      # Assert
      - name: Assert that the program is gone
        run: |
          command=~/.kotlinstall/bin/kotlinstall${{ matrix.host.suffix }}
          if [ -e "$command" ] || [ -L "$command" ]; then
            echo '::error::the program is still installed'
            exit 1
          fi

  list-packages:
    name: should list the installed packages on ${{ matrix.host.name }}
    needs: install-program
    runs-on: ${{ matrix.host.runner }}
    strategy: *hosts
    env: *kotlinstall
    steps:
      # Arrange
      - *checkout
      - *setup-jdk-and-gradle
      - *set-paths
      - *build-kotlinstall
      - *install-program

      # Act
      - name: List the installed packages
        run: '"$KOTLINSTALL" list | tr -d ''\r'' > "$TEMPORARY/list.txt"'

      # Assert
      - name: Assert that the list is the text written here
        run: |
          revision="$(git rev-parse HEAD | cut -c 1-7)"
          diff --unified - "$TEMPORARY/list.txt" <<EOF
          package:  kotlinstall
          commands: kotlinstall
          source:   $WORKSPACE_URL
          revision: $revision
          EOF

  update-packages:
    name: should update kotlinstall itself and every other installed package on ${{ matrix.host.name }}
    needs: install-program
    runs-on: ${{ matrix.host.runner }}
    strategy: *hosts
    env:
      KOTLINSTALL: build/bin/${{ matrix.host.target }}/releaseExecutable/kotlinstall.${{ matrix.host.extension }}
      GIT_AUTHOR_NAME: kotlinstall
      GIT_AUTHOR_EMAIL: kotlinstall@example.com
      GIT_COMMITTER_NAME: kotlinstall
      GIT_COMMITTER_EMAIL: kotlinstall@example.com
    steps:
      # Arrange
      - *checkout
      - *setup-jdk-and-gradle
      - *set-paths
      - *build-kotlinstall

      - name: Create a repository of another program
        run: .github/specs/update-packages/create-hello-repository.sh "$TEMPORARY/hello"

      - name: Install kotlinstall and the other program
        run: |
          "$KOTLINSTALL" install "$WORKSPACE_URL"
          "$KOTLINSTALL" install "$TEMPORARY_URL/hello"

      - name: Add a commit that changes the description of kotlinstall
        run: .github/specs/update-packages/change-kotlinstall.sh "$GITHUB_WORKSPACE"

      - name: Add a commit that changes the message of the other program
        run: .github/specs/update-packages/change-hello.sh "$TEMPORARY/hello"

      # Act
      - name: Update every package with the installed kotlinstall
        run: ~/.kotlinstall/bin/kotlinstall${{ matrix.host.suffix }} update

      # Assert
      - name: Assert that kotlinstall itself was updated
        run: |
          if ! ~/.kotlinstall/bin/kotlinstall${{ matrix.host.suffix }} --help | tr -d '\r' | grep --quiet --fixed-strings --line-regexp '  Updated by a new commit'; then
            echo '::error::kotlinstall was not updated'
            exit 1
          fi

      - name: Assert that the other program was updated
        run: echo 'Hello, 2' | diff --unified - <(~/.kotlinstall/bin/hello${{ matrix.host.suffix }} | tr -d '\r')

      - name: Assert that the list shows the new revisions
        run: |
          hello="$(git -C "$TEMPORARY/hello" rev-parse HEAD | cut -c 1-7)"
          kotlinstall="$(git rev-parse HEAD | cut -c 1-7)"
          ~/.kotlinstall/bin/kotlinstall${{ matrix.host.suffix }} list | tr -d '\r' > "$TEMPORARY/list.txt"
          diff --unified - "$TEMPORARY/list.txt" <<EOF
          package:  hello
          commands: hello
          source:   $TEMPORARY_URL/hello
          revision: $hello

          package:  kotlinstall
          commands: kotlinstall
          source:   $WORKSPACE_URL
          revision: $kotlinstall
          EOF

  help:
    name: should print the help with ${{ matrix.case.arguments }} on ${{ matrix.host.name }}
    runs-on: ${{ matrix.host.runner }}
    strategy:
      fail-fast: false
      matrix:
        host: *host-list
        case:
          - arguments: --help
            help: |
              Usage: kotlinstall [<options>] <command> [<args>]...

                Install Kotlin/Native programs from Git repositories

              Options:
                -h, --help  Show this message and exit

              Commands:
                install    Build a Kotlin/Native Gradle project from a Git repository and install its commands
                update     Reinstall packages when their sources have new commits
                uninstall  Remove installed packages and their commands
                list       List the installed packages and their commands
          - arguments: install --help
            help: |
              Usage: kotlinstall install [<options>] <url>

                Build a Kotlin/Native Gradle project from a Git repository and install its commands

              Options:
                --subdirectory=<subdirectory>  Directory of the Gradle project, relative to the root of the repository
                -h, --help                     Show this message and exit

              Arguments:
                <url>  URL or path of the Git repository
          - arguments: update --help
            help: |
              Usage: kotlinstall update [<options>]

                Reinstall packages when their sources have new commits

              Options:
                -h, --help  Show this message and exit
          - arguments: uninstall --help
            help: |
              Usage: kotlinstall uninstall [<options>] <package>...

                Remove installed packages and their commands

              Options:
                -h, --help  Show this message and exit

              Arguments:
                <package>  Name of the package to remove
          - arguments: list --help
            help: |
              Usage: kotlinstall list [<options>]

                List the installed packages and their commands

              Options:
                -h, --help  Show this message and exit
    env: *kotlinstall
    steps:
      # Arrange
      - *checkout
      - *setup-jdk-and-gradle
      - *set-paths
      - *build-kotlinstall

      # Act
      - name: Run kotlinstall with ${{ matrix.case.arguments }}
        run: '"$KOTLINSTALL" ${{ matrix.case.arguments }} | tr -d ''\r'' > "$TEMPORARY/help.txt"'

      # Assert
      - name: Assert that the help is the text written in this workflow
        env:
          HELP: ${{ matrix.case.help }}
        run: printf '%s' "$HELP" | diff --unified - "$TEMPORARY/help.txt"

  installer-help:
    name: should print the help of the installer script with --help on ${{ matrix.host.name }}
    runs-on: ${{ matrix.host.runner }}
    strategy: *hosts
    steps:
      # Arrange
      - *checkout
      - *setup-jdk-and-gradle
      - *set-paths

      # Act
      - name: Run the installer script with --help as the README says for macOS and Linux
        if: runner.os != 'Windows'
        run: cat install-kotlinstall.main.kts | kotlinr -howtorun .main.kts /dev/stdin --help > "$TEMPORARY/help.txt"

      - name: Run the installer script with --help as the README says for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: kotlinr install-kotlinstall.main.kts --help > "$env:TEMPORARY/help.txt"

      # Assert
      - name: Assert that the help is the text written in this workflow
        env:
          HELP: |
            Usage: install-kotlinstall.main.kts [<options>]

            Options:
              -h, --help  Show this message and exit
        run: printf '%s' "$HELP" | diff --unified - <(tr -d '\r' < "$TEMPORARY/help.txt")

  unrelated-files:
    name: should not touch unrelated files when ${{ matrix.when }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - when: the installer script installs kotlinstall
            arrange: |
              version="$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
              curl --fail --location --output /tmp/kotlin-compiler.zip "https://github.com/JetBrains/kotlin/releases/download/v$version/kotlin-compiler-$version.zip"
              unzip /tmp/kotlin-compiler.zip -d /opt
              rm /tmp/kotlin-compiler.zip
              ln -s /opt/kotlinc/bin/kotlinc /opt/kotlinc/bin/kotlinr /usr/local/bin/
            act: cat install-kotlinstall.main.kts | kotlinr -howtorun .main.kts /dev/stdin --git "file://$PWD"
            allowlist: |
              /root/.kotlinstall/*
              /root/.gradle/*
              /root/.konan/*
              /tmp
              /tmp/*
          - when: it installs a program
            arrange: ./gradlew linkReleaseExecutableLinuxX64
            act: build/bin/linuxX64/releaseExecutable/kotlinstall.kexe install "file://$PWD"
            allowlist: |
              /root/.kotlinstall/*
              /root/.gradle/*
              /root/.konan/*
              /tmp
              /tmp/*
          - when: it updates the installed packages
            arrange: |
              ./gradlew linkReleaseExecutableLinuxX64
              build/bin/linuxX64/releaseExecutable/kotlinstall.kexe install "file://$PWD"
              git -c user.name=kotlinstall -c user.email=kotlinstall@example.com commit --quiet --allow-empty --message "Add a commit to update to"
            act: /root/.kotlinstall/bin/kotlinstall update
            allowlist: |
              /root/.kotlinstall/*
              /root/.gradle/*
              /root/.konan/*
              /tmp
              /tmp/*
          - when: it uninstalls a program
            arrange: |
              ./gradlew linkReleaseExecutableLinuxX64
              build/bin/linuxX64/releaseExecutable/kotlinstall.kexe install "file://$PWD"
            act: build/bin/linuxX64/releaseExecutable/kotlinstall.kexe uninstall kotlinstall
            allowlist: |
              /root/.kotlinstall/*
    steps:
      # Arrange
      - *checkout

      - name: Check every change that is made when ${{ matrix.when }}
        uses: yuyuyuyuyu-dev/assert-no-unexpected-changes@v1
        with:
          workdir: /kotlinstall
          arrange: |
            apt-get update
            apt-get install --yes --no-install-recommends ca-certificates curl git openjdk-25-jdk-headless unzip
            ${{ matrix.arrange }}
          # Act
          act: ${{ matrix.act }}
          # Assert
          allowlist: ${{ matrix.allowlist }}

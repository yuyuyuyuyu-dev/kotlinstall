name: Lint

on:
  pull_request:

  push:
    branches: ["main"]

  workflow_dispatch:

permissions: {}

concurrency:
  group: "lint-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  oxfmt:
    name: Oxfmt
    permissions:
      contents: read
    uses: yuyuyuyuyu-dev/repo-config/.github/workflows/oxfmt.yml@67cc1a26392550fd5ba9318bd90cc4f869392cf1

  kotlin-lint:
    name: Kotlin lint
    permissions:
      contents: read
    uses: yuyuyuyuyu-dev/repo-config/.github/workflows/kotlin-lint.yml@67cc1a26392550fd5ba9318bd90cc4f869392cf1

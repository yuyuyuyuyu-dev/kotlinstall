name: Lint

on:
  pull_request:

  push:
    branches: ["main"]

  workflow_dispatch:

permissions: {}

concurrency:
  group: "lint-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  biome:
    name: Biome
    permissions:
      contents: read
    uses: yuyuyuyuyu-dev/repo-config/.github/workflows/biome.yml@main

  kotlin-lint:
    name: Kotlin lint
    permissions:
      contents: read
    uses: yuyuyuyuyu-dev/repo-config/.github/workflows/kotlin-lint.yml@main
